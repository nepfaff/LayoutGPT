[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "layoutgpt"
version = "0.1.0"
description = "Compositional Visual Planning and Generation with Large Language Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # PyTorch (CUDA 12.4)
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-lightning>=2.0.0",
    "torchmetrics>=0.11.0",

    # Transformers/LLM
    "transformers>=4.30.0",
    "openai>=1.0.0",
    "accelerate>=0.20.0",
    "sentencepiece>=0.1.99",

    # Vision
    "opencv-python>=4.7.0",
    "pillow>=9.5.0",
    "albumentations>=1.3.0",
    "kornia>=0.6.12",
    "einops>=0.6.1",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.8",

    # 3D/Geometry
    "trimesh>=3.22.0",
    "simple-3dviz>=0.7.0",
    "pyrr>=0.10.3",
    "shapely>=2.0.0",
    "networkx>=3.0",

    # Data processing
    "numpy<2",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-image>=0.21.0",
    "scikit-learn>=1.2.0",

    # Utils
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "cssutils>=2.6.0",
    "protobuf>=3.20.0,<4.0.0",
    "cython>=0.29.35",
    "yacs>=0.1.8",
    "inflect>=6.0.0",

    # Visualization/Streaming
    "streamlit>=1.23.0",
    "tensorboard>=2.13.0",
    "matplotlib>=3.7.0",

    # CLIP
    "ftfy>=6.1.0",
    "regex>=2023.0.0",
    "clip @ git+https://github.com/openai/CLIP.git",

    # ATISS (3D scene synthesis)
    "scene-synthesis",
]

[project.optional-dependencies]
visualization = [
    "wxPython>=4.2.0",
]
dev = [
    "pytest",
    "pudb>=2022.1.3",
]

[tool.setuptools]
py-modules = []
packages = []

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
scene-synthesis = { path = "./ATISS", editable = true }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
